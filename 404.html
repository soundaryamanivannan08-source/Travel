<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly</title>
  <meta name="description" content="The page or luxury destination you were looking for could not be found. Return to Wanderlust to discover handpicked villas, resorts, and chalets worldwide.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Base Site Styles & Dedicated 404 Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/404.css">
</head>
<body class="error-page-wrapper">

  <!-- Ambient Glowing Backdrop Shapes -->
  <div class="error-bg-glow error-bg-glow-1"></div>
  <div class="error-bg-glow error-bg-glow-2"></div>

  <!-- ===================================================================
       Main 404 Error Hero Section
       =================================================================== -->
  <main class="error-main-content">
    <div class="error-card">
      
      <!-- Brand Logo -->
      <a href="index.html" class="error-logo-link" aria-label="Wanderlust Home">
        <img src="assets/stackly_logo_transparent.png" alt="Stackly Wanderlust" class="error-brand-logo">
      </a>

      <!-- Travel Tag Badge -->
      <div class="error-badge">
        <i class="fa-solid fa-compass"></i> Lost in Paradise
      </div>

      <!-- Large Gradient 404 with Floating Airplane -->
      <div class="error-number-wrap">
        <h1 class="error-big-number">404</h1>
        <div class="error-icon-satellite" title="Off the beaten path">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
      </div>

      <!-- Main Headline & Narrative -->
      <h2 class="error-headline">You've Traveled Off the Map</h2>
      <p class="error-description">
        The luxury sanctuary or destination you are searching for might have relocated, changed its seasonal coordinates, or drifted beyond our digital atlas.
      </p>

      <!-- Primary Action Buttons -->
      <div class="error-cta-group">
        <a href="index.html" class="error-btn-primary">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
        
        <button type="button" onclick="history.back()" class="error-btn-outline" aria-label="Go to Previous Page">
          <i class="fa-solid fa-arrow-left"></i> Go to Previous
        </button>
      </div>

    </div>
  </main>

  <!-- ===================================================================
   

</body>
</html>
